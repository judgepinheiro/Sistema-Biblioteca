
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="icon" type="image/png" th:href="@{/css/livro.png}">
</head>
<body>
    <main class="conteudo">
        <h1>Cadastrar Livro</h1>

        <form th:action="@{/livros}" th:object="${livro}" method="post">
            <label for="titulo">Título:</label>
            <input id="titulo" type="text" th:field="*{titulo}" required>

            <label for="autor">Autor:</label>
            <input id="autor" type="text" th:field="*{autor}" required>

            <label for="isbn">ISBN:</label>
            <input id="isbn" type="text" th:field="*{isbn}" required>

            <label for="anoPublicacao">Ano de publicação:</label>
            <input id="anoPublicacao"type="number"th:field="*{anoPublicacao}"min="1"required>

            <button type="submit">Cadastrar</button>
        </form>

        <p><a th:href="@{/livros}">Voltar para o início</a></p>
    </main>
</body>
</html>
