
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autores - Sistema de Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <header>
        <h1>Sistema de Biblioteca</h1>
        <p>Autores</p>
    </header>

    <nav>
        <a th:href="@{/livros}">Livros</a>
        <a th:href="@{/autores}">Autores</a>
        <a href="#">Categorias</a>
        <a href="#">Usuários</a>
        <a href="#">Empréstimos</a>
    </nav>

    <main class="container">
<h2>Autores cadastrados</h2>

        <a class="botao" th:href="@{/autores/novo}">Novo Autor</a>

        <hr>

        

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="autor : ${autores}">
                    <td th:text="${autor.id}"></td>
                    <td th:text="${autor.nome}"></td>
                    <td th:text="${autor.email}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(autores)}">
                    <td colspan="3">Nenhum autor cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
